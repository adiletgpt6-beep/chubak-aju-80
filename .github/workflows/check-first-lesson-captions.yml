name: Check first lesson captions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade yt-dlp
      - name: Inspect caption availability for lesson 1
        run: python scripts/check_captions.py
      - name: Save results even if YouTube blocks access
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-001-caption-availability
          path: data/captions/lesson-001-availability.json
          if-no-files-found: warn
          retention-days: 30
